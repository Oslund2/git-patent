[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."ai-generate"]
  timeout = 26

[functions."pipeline-write"]
  timeout = 10

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
